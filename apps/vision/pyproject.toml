[project]
name = "access-control-vision"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.12",
  "pydantic-settings==2.9.1",
  "uvicorn[standard]==0.34.2",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.3.5",
  "ruff==0.11.10",
]
real = [
  "insightface==0.7.3",
  "onnxruntime==1.21.1",
  "opencv-python-headless==4.11.0.86",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
