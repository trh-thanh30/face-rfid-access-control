services:
  db:
    image: pgvector/pgvector:pg16
    container_name: access-control-db
    environment:
      POSTGRES_DB: ${DB_NAME:-access_control}
      POSTGRES_USER: ${DB_USER:-access_control_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-access_control_password}
    ports:
      - "${DB_PORT:-15432}:5432"
    volumes:
      - access_control_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  access_control_postgres_data:
